name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译并打包 DMG
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看环境
        run: |
          sw_vers
          xcodebuild -version || true
          swiftc --version

      - name: 安装 Python 依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 dmgbuild
        run: python3 -m pip install --upgrade pip dmgbuild

      - name: 构建 App 与 DMG
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: 验证产物
        run: |
          ls -lh dist/
          DMG_FILE="$(ls dist/*.dmg | head -1)"
          echo "校验文件：$DMG_FILE"
          hdiutil attach "$DMG_FILE" -nobrowse -readonly
          ls -la "/Volumes/OFD弹出助手/"
          hdiutil detach "/Volumes/OFD弹出助手"
          lipo -info "build/OFD弹出助手.app/Contents/MacOS/OFD弹出助手"

      - name: 上传构建产物（每次运行都可用）
        uses: actions/upload-artifact@v4
        with:
          name: OFD弹出助手-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
